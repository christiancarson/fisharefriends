["morice-river"]
about = "The Morice River is the outflow of Morice Lake southwest of Houston, British Columbia, Canada. Morice Lake and Morice River are named after Father Adrien-Gabriel Morice. The Morice has many small creeks joining it along its length, but retains the clear glacial hue for its length. The Morice River continues on to the town of Houston, at which point the river is joined by a small tributary river called the Little Bulkley River, and the two rivers joined become the Bulkley River. They become the Bulkley, not the Morice, despite the fact that the Morice is larger. This was done by Poudrier, a government cartographer who, it is rumoured, never saw the region."
source = "https://en.wikipedia.org/wiki/Morice_River"

["squamish-river"]
about = "The Squamish River is a short but very large river in the Canadian province of British Columbia. Its drainage basin is 3,328 square kilometres (1,285 sq mi) in size. The total length of the Squamish River is approximately 80 kilometres (50 mi)."
source = "https://en.wikipedia.org/wiki/Squamish_River"

