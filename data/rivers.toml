["morice-river"]
about = "Wedzin Kwa to the Wet'suwet'en, whose territory it runs through. It leaves Morice Lake, Wedzin Bin, in the Coast Mountains and joins the Bulkley at Houston on its way to the Skeena. Chinook, sockeye, coho and pink salmon spawn here, and the summer steelhead that come up the Skeena and Bulkley hold in it through the fall. The settler name is for Father Adrien-Gabriel Morice, an Oblate missionary who travelled and mapped this country in the late 1800s."

["squamish-river"]
about = "Skwxwú7mesh territory, and the largest watershed on the Strait of Georgia: the Elaho, Ashlu, Cheakamus, Mamquam and Stawamus all feed it before it reaches Howe Sound at Squamish. Every Pacific salmon spawns here, with a winter run of chum and coho, and the river holds winter steelhead. Logging and diking took much of the lowland habitat, and since 2002 it has been one of six watersheds in the province where salmon recovery work is focused, much of it led by the Squamish River Watershed Society. Brackendale, on its banks, gathers one of the largest winter gatherings of bald eagles anywhere."
