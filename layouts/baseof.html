<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
<script src="{{ "js/signup.js" | relURL }}" defer></script>
{{ with site.Home.OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
{{ partial "doodles.html" . }}
<header class="band">
<div class="wrap">
<a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}<svg class="doodle blue swim" aria-hidden="true"><use href="#fish"/></svg></a>
<p class="domain">{{ (urls.Parse site.BaseURL).Host }}</p>
<nav><a href="{{ site.Home.RelPermalink }}">top</a><a href="{{ (site.GetPage "trips").RelPermalink }}">trips</a><a href="{{ (site.GetPage "archive").RelPermalink }}">archive</a></nav>
</div>
</header>
<div class="wrap cols">
<main>{{ block "main" . }}{{ end }}</main>
{{ partial "sidebar.html" . }}
</div>
<footer class="wrap"><svg class="doodle red" aria-hidden="true"><use href="#flower"/></svg><svg class="doodle green" aria-hidden="true"><use href="#flower"/></svg><svg class="doodle blue" aria-hidden="true"><use href="#flower"/></svg></footer>
</body>
</html>
