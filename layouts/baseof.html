<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
<script src="{{ "js/signup.js" | relURL }}" defer></script>
{{ with site.Home.OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
{{ partial "doodles.html" . }}
<div class="wrap cols">
<div>
<header class="band">
<a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}<svg class="doodle blue mark" aria-hidden="true"><use href="#fishpals"/></svg></a>
</header>
<main>{{ block "main" . }}{{ end }}</main>
</div>
{{ partial "sidebar.html" . }}
</div>
<footer class="wrap"><p>the layout and form of this website was heavily inspired by <a href="https://dyun5.exblog.jp/">slow fishing</a></p></footer>
</body>
</html>
