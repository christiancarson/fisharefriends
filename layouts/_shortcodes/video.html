<figure class="card video"><div class="frame"><iframe src="https://www.youtube.com/embed/{{ .Get 0 }}" title="{{ .Get 1 }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><figcaption><a class="ftitle" href="https://www.youtube.com/watch?v={{ .Get 0 }}">{{ .Get 1 }}</a>{{ with .Inner }}<p>{{ . | markdownify }}</p>{{ end }}</figcaption></figure>
