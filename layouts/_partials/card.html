{{ $c := .card }}{{ $p := .page }}{{ $slugs := partial "cardtags.html" $c }}{{ with $p.Resources.Get $c.file }}{{ $m := .Resize "968x q80" }}<figure class="card" data-tags="{{ delimit $slugs " " }}"><a href="{{ .RelPermalink }}"><img src="{{ $m.RelPermalink }}" width="484" height="{{ div $m.Height 2 }}" alt="{{ $c.caption }}"></a><figcaption>{{ with $c.title }}{{ $u := $.link }}{{ if not $u }}{{ with site.GetPage (printf "/categories/%s" (index $slugs 0)) }}{{ $u = .RelPermalink }}{{ end }}{{ end }}{{ with $u }}<a class="ftitle" href="{{ . }}">{{ $c.title }}</a>{{ else }}<span class="ftitle">{{ $c.title }}</span>{{ end }}{{ end }}<p>{{ $c.caption }}</p><p class="tags">{{ range $c.tags }}{{ $t := . }}{{ with site.GetPage (printf "/categories/%s" (urlize $t)) }}<a href="{{ .RelPermalink }}">{{ $t }}</a>{{ else }}<span>{{ $t }}</span>{{ end }}{{ end }}</p>{{ partial "from.html" $ }}</figcaption></figure>{{ end }}
