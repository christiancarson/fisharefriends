{{ $c := .card }}{{ $slugs := partial "cardtags.html" $c }}<figure class="card video" data-tags="{{ delimit $slugs " " }}"><div class="frame"><iframe src="https://www.youtube.com/embed/{{ $c.id }}" title="{{ $c.title }}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><figcaption><a class="ftitle" href="{{ .link | default (site.GetPage "/categories/music").RelPermalink }}">{{ $c.title }}</a>{{ with $c.caption }}<p>{{ . | markdownify }}</p>{{ end }}<p class="tags"><a href="https://www.youtube.com/watch?v={{ $c.id }}">watch on youtube</a></p>{{ partial "from.html" . }}</figcaption></figure>
