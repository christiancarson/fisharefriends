{{ with . }}{{ $r := . }}{{ with resources.Get (printf "maps/%s.svg" (. | urlize)) }}{{ $d := index site.Data.rivers ($r | urlize) }}{{ $g := cond (hasSuffix $r " Lake") "lakes" "rivers" }}<figure class="card map" data-tags="{{ $g }} {{ $r | urlize }}"><div class="doodle" aria-hidden="true">{{ .Content | safeHTML }}</div><figcaption><a class="ftitle" href="{{ (site.GetPage (printf "/categories/%s" $g)).RelPermalink }}">{{ with $d }}{{ .title | default $r }}{{ else }}{{ $r }}{{ end }}</a>{{ with $d }}{{ with .about }}<p>{{ . }}</p>{{ end }}{{ end }}</figcaption></figure>{{ end }}{{ end }}
