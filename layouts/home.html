{{ define "main" }}
<div class="intro">{{ .Content }}</div>
<p><a class="button" id="random" href="{{ (site.GetPage "posts").RelPermalink }}">take me to a random post</a></p>
{{ $urls := slice }}{{ range where site.RegularPages "Section" "posts" }}{{ $urls = $urls | append .RelPermalink }}{{ end }}<script>const posts = {{ $urls | jsonify | safeJS }}
document.getElementById('random').addEventListener('click', e => { e.preventDefault(); location.href = posts[Math.floor(Math.random() * posts.length)] })</script>
{{ end }}
